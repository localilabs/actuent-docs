name: Regenerate Tool Examples
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node examples/generate.mjs
      - name: Commit if changed
        run: |
          git config user.name "actuent-bot"
          git config user.email "support@localilabs.com"
          git add examples.html
          git diff --cached --quiet || (git commit -m "Tool examples: weekly refresh from live calls" && git push)
